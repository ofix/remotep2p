<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>RemoteP2P WebUI</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui
        }

        body {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px;
            background: #f7f8fa;
            color: #222
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px #00000012
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        input,
        button,
        textarea {
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ddd
        }

        button {
            background: #2563eb;
            color: #fff;
            border: 0;
            cursor: pointer
        }

        button:disabled {
            background: #94a3b8
        }

        #log {
            height: 240px;
            overflow: auto;
            background: #111;
            color: #8cf;
            padding: 10px;
            font-family: monospace;
            font-size: 12px
        }

        #eventLog {
            height: 220px;
            overflow: auto;
            background: #0f172a;
            color: #a5f3fc;
            padding: 10px;
            font-family: monospace;
            font-size: 12px
        }

        .badge {
            font-size: 12px;
            padding: 3px 6px;
            border-radius: 999
        }

        .ok {
            background: #dcfce7;
            color: #166534
        }

        .warn {
            background: #fffbeb;
            color: #92400e
        }

        .no {
            background: #fee2e2;
            color: #991b1b
        }

        pre {
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 180px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
        }

        .img-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 6px;
            cursor: zoom-in;
        }
    </style>
</head>

<body>
    <h1>RemoteP2P</h1>
    <div class="card">
        <h3>平台能力｜流量 <span id="rx">0 B</span> / <span id="tx">0 B</span></h3>
        <div id="cap"></div>
    </div>
    <div class="card">
        <h3>剪贴板</h3>
        <textarea id="clipText" rows="4" style="width:100%" placeholder="输入文本发送到对等节点"></textarea>
        <div class="row">
            <button onclick="readClip()">读取本机剪贴板</button>
            <button onclick="sendClipText()">发送文本</button>
        </div>
        <pre id="clipPreview"></pre>
        <div id="clipImgBox"></div>
    </div>
    <div class="card" style="padding:12px;margin:8px 0;background:#fff;border-radius:10px;border:1px solid #e5e7eb;">
        <div style="font-weight:bold;margin-bottom:8px;">在线节点</div>
        <div id="peerList"></div>
    </div>
    <div class="card">
        <h3>实时事件（WebSocket）</h3>
        <div id="eventLog"></div>
    </div>
    <div class="card">
        <h3>任务列表</h3>
        <div id="taskList"></div>
    </div>
    <div class="card">
        <h3>日志</h3>
        <div id="log"></div>
    </div>
    <script>
        const logDiv = document.getElementById('log');
        const eventDiv = document.getElementById('eventLog');
        let ws;
        let peers = new Map();
        let tasks = new Map();
        let isReconnecting = false;
        const MAX_LOG_LINE = 200;

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return "0 B";
            const units = ["B", "KB", "MB", "GB", "TB"];
            let i = 0;
            let v = bytes;
            while (v >= 1024 && i < units.length - 1) {
                v /= 1024;
                i++;
            }
            return v.toFixed(2) + " " + units[i];
        }

        function renderPeerList() {
            const wrap = document.getElementById("peerList");
            if (peers.size === 0) {
                wrap.innerHTML = "<div style='color:#666'>暂无在线节点</div>";
                return;
            }
            let html = "";
            for (const [addr, p] of peers) {
                let tagColor = p.source === "zeroconf" ? "#22c55e" : "#3b82f6";
                let tagText = p.source === "zeroconf" ? "mDNS自动发现" : "静态配置";
                html += `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#f8fafc;border-radius:6px;margin:4px 0;">
      <span>${addr}</span>
      <span style="font-size:12px;color:white;padding:2px 6px;border-radius:999;background:${tagColor}">${tagText}</span>
    </div>`;
            }
            wrap.innerHTML = html;
        }

        function renderTaskList() {
            const wrap = document.getElementById("taskList");
            if (tasks.size === 0) {
                wrap.innerHTML = "<div style='color:#666'>暂无传输任务</div>";
                return;
            }
            let html = "";
            for (const [bid, t] of tasks) {
                const pct = t.percent ?? 0;
                const errHtml = t.error ? `<div style="color:#dc2626">错误：${t.error}</div>` : "";
                html += `
    <div style="padding:8px;background:#f8fafc;border-radius:6px;margin:4px 0;">
      <div>批次:${bid} | ${t.name ?? "-"}</div>
      <div style="height:6px;background:#ddd;border-radius:3px;margin:4px 0;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:#2563eb;"></div>
      </div>
      <div>${pct.toFixed(1)}% ${errHtml}</div>
    </div>`;
            }
            wrap.innerHTML = html;
        }

        function log(s) {
            logDiv.innerHTML += new Date().toLocaleTimeString() + ' ' + s + '\n';
            const lines = logDiv.innerHTML.split("\n");
            if (lines.length > MAX_LOG_LINE) logDiv.innerHTML = lines.slice(-MAX_LOG_LINE).join("\n");
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        function evLog(s) {
            eventDiv.innerHTML += new Date().toLocaleTimeString() + ' ' + s + '\n';
            const lines = eventDiv.innerHTML.split("\n");
            if (lines.length > MAX_LOG_LINE) eventDiv.innerHTML = lines.slice(-MAX_LOG_LINE).join("\n");
            eventDiv.scrollTop = eventDiv.scrollHeight;
        }

        function connectWS() {
            if (isReconnecting) return;
            isReconnecting = true;
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => {
                evLog("✅ WS connected");
                isReconnecting = false;
            };
            ws.onclose = () => {
                evLog("❌ WS closed, reconnect...");
                isReconnecting = false;
                setTimeout(connectWS, 2000);
            };
            ws.onmessage = (e) => {
                try {
                    const ev = JSON.parse(e.data);
                    evLog(`[${ev.type}] ${JSON.stringify(ev.data)}`);

                    if (ev.type === "traffic_stats") {
                        const g = ev.data.global;
                        document.getElementById('rx').innerText = formatBytes(g.rx);
                        document.getElementById('tx').innerText = formatBytes(g.tx);
                    } else if (ev.type === "task_start") {
                        tasks.set(ev.data.batch_id, { ...ev.data, percent: 0, error: null });
                        renderTaskList();
                    } else if (ev.type === "task_progress") {
                        const t = tasks.get(ev.data.batch_id);
                        if (t) tasks.set(ev.data.batch_id, { ...t, ...ev.data });
                        renderTaskList();
                    } else if (ev.type === "task_done") {
                        const t = tasks.get(ev.data.batch_id);
                        if (t) {
                            tasks.set(ev.data.batch_id, { ...t, ...ev.data, percent: 100 });
                            renderTaskList();
                        }
                        setTimeout(() => { tasks.delete(ev.data.batch_id); renderTaskList() }, 3000);
                    } else if (ev.type === "task_error") {
                        const t = tasks.get(ev.data.batch_id);
                        if (t) tasks.set(ev.data.batch_id, { ...t, error: ev.data.err });
                        renderTaskList();
                    } else if (ev.type === "peer_up") {
                        peers.set(ev.data.addr, ev.data);
                        renderPeerList();
                    } else if (ev.type === "peer_down") {
                        peers.delete(ev.data.addr);
                        renderPeerList();
                    }
                } catch (err) {
                    evLog("消息解析异常:" + err.message);
                }
            };
        }
        connectWS();

        async function readClip() {
            try {
                const res = await fetch('/api/clip/read');
                const data = await res.json();
                document.getElementById('clipText').value = data.text ?? "";
                document.getElementById('clipPreview').innerText = JSON.stringify(data, null, 2);
                // 剪贴板图片渲染
                const imgBox = document.getElementById("clipImgBox");
                if (data.image) {
                    imgBox.innerHTML = `<img class="img-preview" src="${data.image}" alt="剪贴板图片">`;
                } else {
                    imgBox.innerHTML = "";
                }
                log('读取剪贴板成功');
            } catch (err) {
                log("读取剪贴板失败:" + err.message);
            }
        }
        async function sendClipText() {
            try {
                const text = document.getElementById('clipText').value;
                await fetch('/api/clip/send/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                })
                log('发送剪贴板文本：' + text);
            } catch (err) {
                log("发送剪贴板失败:" + err.message);
            }
        }
        function renderCap() {
            const ua = navigator.userAgent;
            let cap = '';
            if (ua.includes('Win')) cap = '<span class="badge ok">Win:文本+图片+文件剪贴板</span>';
            else if (ua.includes('Mac')) cap = '<span class="badge warn">macOS PureGo:仅文本</span> <span class="badge ok">macOS CGO:文本+图片+文件</span>';
            else cap = '<span class="badge warn">Linux:xclip 文本+图片+uri文件列表</span>';
            document.getElementById('cap').innerHTML = cap;
        }
        renderCap();
        renderPeerList();
        renderTaskList();
    </script>
</body>

</html>
